name: Isolated PR feedback validation

on:
  push:
    branches: [review/oxvim-feedback-20260920]
    paths: [.github/workflows/review-feedback.yml, .review-patches/**]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz --output=oxvim-review-source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oxvim-review-source
          path: oxvim-review-source.tar.gz
          retention-days: 1
